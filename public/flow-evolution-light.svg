  <line x1="480" y1="228" x2="480" y2="248" stroke="#3EB0EA" stroke-width="1.25"/>
  <circle cx="480" cy="238" r="2.2" fill="#3EB0EA"/>
  <line x1="470" y1="346" x2="490" y2="346" stroke="#3EB0EA" stroke-width="1.25"/>
  <circle cx="480" cy="346" r="2.2" fill="#3EB0EA"/>
  <line x1="480" y1="436" x2="480" y2="456" stroke="#3EB0EA" stroke-width="1.25"/>
