<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 248" role="img" aria-label="Evolution: Learning Graph, Knowledge Graph for Teams">
  <text x="480" y="28" text-anchor="middle" fill="#2E5A9A" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="600" letter-spacing="0.28em">EVOLUTION</text>

  <line x1="470" y1="138" x2="490" y2="138" stroke="#3EB0EA" stroke-width="1.25"/>
  <circle cx="480" cy="138" r="2.2" fill="#3EB0EA"/>

  <rect x="16" y="52" width="454" height="176" rx="20" fill="#ffffff" stroke="#d5d5dc"/>
  <text x="44" y="88" fill="#3EB0EA" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="600" letter-spacing="0.08em">03</text>
  <text x="44" y="124" fill="#0B1120" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="600">Learning Graph</text>
  <text x="44" y="156" fill="#5a6270" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13">Applied work feeds the next brief. The graph compounds.</text>

  <rect x="490" y="52" width="454" height="176" rx="20" fill="#ffffff" stroke="#d5d5dc"/>
  <text x="518" y="88" fill="#3EB0EA" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="600" letter-spacing="0.08em">04</text>
  <text x="518" y="124" fill="#0B1120" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="600">Knowledge Graph for Teams</text>
  <text x="518" y="156" fill="#5a6270" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13">One graph the team and their AI workers share and compound.</text>
