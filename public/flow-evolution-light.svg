<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 248" role="img" aria-label="Evolution: Connected Knowledge, Agent Context, Learning Graph">
  <text x="480" y="28" text-anchor="middle" fill="#2E5A9A" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="600" letter-spacing="0.28em">EVOLUTION</text>

  <line x1="308" y1="138" x2="332" y2="138" stroke="#3EB0EA" stroke-width="1.25"/>
  <circle cx="320" cy="138" r="2.2" fill="#3EB0EA"/>
  <line x1="628" y1="138" x2="652" y2="138" stroke="#3EB0EA" stroke-width="1.25"/>
  <circle cx="640" cy="138" r="2.2" fill="#3EB0EA"/>

  <rect x="16" y="52" width="292" height="176" rx="20" fill="#ffffff" stroke="#d5d5dc"/>
  <text x="40" y="88" fill="#3EB0EA" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="600" letter-spacing="0.08em">01</text>
  <text x="40" y="124" fill="#0B1120" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="600">Connected Knowledge</text>
  <text x="40" y="156" fill="#5a6270" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13">What you capture lives in your repo</text>
  <text x="40" y="176" fill="#5a6270" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13">and reaches every agent.</text>

  <rect x="334" y="52" width="292" height="176" rx="20" fill="#ffffff" stroke="#d5d5dc"/>
  <text x="358" y="88" fill="#3EB0EA" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="600" letter-spacing="0.08em">02</text>
  <text x="358" y="124" fill="#0B1120" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="600">Agent Context</text>
  <text x="358" y="156" fill="#5a6270" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13">The right capture surfaces in the</text>
  <text x="358" y="176" fill="#5a6270" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13">work you are doing.</text>

  <rect x="652" y="52" width="292" height="176" rx="20" fill="#ffffff" stroke="#d5d5dc"/>
  <text x="676" y="88" fill="#3EB0EA" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="600" letter-spacing="0.08em">03</text>
  <text x="676" y="124" fill="#0B1120" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="600">Learning Graph</text>
  <text x="676" y="156" fill="#5a6270" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13">Applied work feeds the next brief.</text>
  <text x="676" y="176" fill="#5a6270" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13">The graph compounds.</text>
</svg>
