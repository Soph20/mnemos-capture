# Nothing was watching the dependency tree: six high-severity CVEs sat in the
# production graph unnoticed (a WebSocket flaw in the Postgres driver's
# transport, reached by every query), and the Anthropic SDK drifted ~85
# releases behind. Weekly, grouped so the noise stays manageable.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Patch and minor bumps are the routine hygiene this exists for —
      # one PR a week rather than one per package.
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # Majors arrive as individual PRs: they need reading, not batching.

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
